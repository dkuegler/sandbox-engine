# Sample sandbox.yml: copy to the project root as "sandbox.yml" and commit it.
# An uncommitted or locally modified sandbox.yml refuses the run; edits to
# whole-line comments do not count. Reference: docs/usage.md.

# Base image. First key set wins: image, dockerfile, preset (default uv).
# --environment KEY=VALUE overrides a key for one run.
#   image: <ref>          this image, verbatim
#   dockerfile: <path>    relative to the project; its last stage is the base
#   preset: <name>        uv | python | shell | latex
#   python_version: "X"   uv and python presets only
environment:
  preset: uv
  python_version: "3.13"

# Extra mounts, read-only unless ":rw". A source outside the project needs
# confirmation on the terminal, or --allow-external-binds.
# binds:
#   - /data
#   - /data:/mnt/data
#   - /scratch/out:/out:rw

# Where the agent may leave patches for files it cannot write. Must be
# gitignored; otherwise the channel is off for the run.
# patches: .agent/patches
