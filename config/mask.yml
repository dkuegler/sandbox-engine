# Config mask: the known executable-config surfaces the sandbox masks --
# what an agent CLI, an editor, direnv or a hook framework executes or
# auto-loads from a checkout (read by project_config_mask_load,
# functions/binds.sh).
#
# "project:" is the single table of those surfaces inside a checkout,
# relative to the checkout root the mask is resolved against. Each entry
# is "- file: PATH" or "- dir: PATH": a single file, or a directory whose
# whole content counts as config. PATH is relative to the checkout root
# and made only of A-Z a-z 0-9 . _ / - (no leading "/", no "." or ".."
# component), so it is always a plain YAML string.
#
# "anywhere:" lists file names matched at EVERY depth of the checkout,
# gitignored or not, and decided by the same rule as a "project:" row.
# Each entry is "- name: BASENAME", made only of A-Z a-z 0-9 . _ - (no
# "/", not "." or "..").
#
# This is a strict subset of YAML, parsed without a YAML library: comment
# lines, blank lines, the two keys (each once) and entries exactly as
# above. Anything else -- a different indent, quoting, a trailing
# comment, an unknown key, a key with no entries -- refuses the run
# rather than being skipped, because a row that silently dropped out
# would look exactly like a mask that works.
#
# The table IS the perimeter of the whole masking convention -- nothing
# discovers configs -- so every new agent or tool surface lands here by
# hand and the set is audited per agent onboarding. Comment lines carry
# the vector each group closes.
#
# sandbox.yml is an ordinary row on this table. The SANDBOX itself parses
# it on the host before any container exists, and no container mask can
# intercept that read; that read is gated where it happens instead -- the
# file is refused outright unless it is committed and clean
# (parse_project_sandbox_config, functions/project-sandbox-config.sh).
# The row only keeps the session from reading an uncommitted copy or
# rewriting a committed one.
#
# Root-level, deliberately: every supported agent (claude, opencode, omp)
# is always launched with its cwd at the project root (or the worktree
# root), and none of them walks above its cwd for config. The always-
# loaded instruction files are the exception discovery can reach at
# other depths; "project:" carries their root-level copies, and
# "anywhere:" the basenames swept at every depth.

project:
  # sandbox.yml decides this sandbox's own binds, environment and base
  # image. The host parses it before any container exists, so its real
  # gate is the tracked-and-clean refusal in parse_project_sandbox_config
  # (functions/project-sandbox-config.sh); the row below only keeps the
  # session from reading an uncommitted copy or rewriting a committed one.
  - file: sandbox.yml

  # Claude Code: project-scope settings, its own MCP files, and the
  # subagent/command/skill content directories mirrored from its global
  # equivalents.
  - file: .claude/settings.json
  - file: .claude/settings.local.json
  - file: .claude/mcp.json
  - file: .claude/.mcp.json
  - dir: .claude/hooks
  - dir: .claude/plugins
  - dir: .claude/agents
  - dir: .claude/commands
  - dir: .claude/skills
  - dir: .claude/rules
  - dir: .claude/output-styles

  # opencode: project-root config (both spellings) and its own content
  # directories, current-plural and back-compat-singular.
  - file: opencode.json
  - file: opencode.jsonc
  - dir: .opencode/plugin
  - dir: .opencode/plugins
  - dir: .opencode/agent
  - dir: .opencode/agents
  - dir: .opencode/command
  - dir: .opencode/commands
  - dir: .opencode/mode
  - dir: .opencode/modes
  - dir: .opencode/tool
  - dir: .opencode/tools
  - dir: .opencode/skill
  - dir: .opencode/skills
  - dir: .opencode/theme
  - dir: .opencode/themes

  # omp: project-local settings/MCP files (docs/settings.md,
  # docs/mcp-config.md).
  - file: .omp/config.yml
  - file: .omp/settings.json
  - file: .omp/mcp.json
  - file: .omp/.mcp.json

  # Root fallback MCP files every discovery chain can read.
  - file: mcp.json
  - file: .mcp.json

  # Other tools' project config omp's cross-tool MCP discovery reads
  # regardless of which agent this run uses.
  - file: .codex/config.toml
  - file: .gemini/settings.json
  - file: .cursor/mcp.json
  - file: .windsurf/mcp_config.json
  - file: .vscode/mcp.json

  # Editor task/debug config VS Code runs without being asked:
  # tasks.json runOptions.runOn=folderOpen on folder open,
  # launch.json preLaunchTask/postDebugTask on every debug session.
  - file: .vscode/tasks.json
  - file: .vscode/launch.json

  # devcontainer.json initializeCommand runs on the HOST before any
  # container is built.
  - file: .devcontainer/devcontainer.json

  # direnv executes .envrc, as the human, on cd.
  - file: .envrc

  # .pre-commit-config.yaml names programs the commit path fetches and
  # runs.
  - file: .pre-commit-config.yaml

  # Always-loaded instruction files: nothing executes these, but every
  # agent reads them into its system prompt unprompted.
  - file: AGENTS.md
  - file: CLAUDE.md
  - file: CLAUDE.local.md
  - file: .cursorrules
  - file: .github/copilot-instructions.md

  # omp: RULES.md is always-apply -- injected into the system prompt on
  # every request -- and rules/ is loaded the same way.
  - file: .omp/RULES.md
  - file: .omp/AGENTS.md
  - dir: .omp/rules

  # Claude Code's own project-scope instruction copies.
  - file: .claude/CLAUDE.md
  - file: .claude/AGENTS.md

  # Other assistants that auto-load project instructions, read whether or
  # not this run's agent is the one that wrote them.
  - file: .gemini/GEMINI.md
  - dir: .github/instructions
  - dir: .cursor/rules
  - dir: .windsurf/rules
  - file: .windsurfrules
  - file: .clinerules

  # Tool-neutral agent directories (.agent/, .agents/).
  - file: .agent/AGENTS.md
  - dir: .agent/rules
  - file: .agents/AGENTS.md
  - dir: .agents/rules

anywhere:
  # Always-loaded instruction files discovery reaches below the checkout
  # root: claude injects a subdirectory's copy when it first reads a file
  # there, omp points the session at it.
  - name: AGENTS.md
  - name: CLAUDE.md
  - name: CLAUDE.local.md
  - name: .cursorrules

  # direnv executes .envrc, as the human, on cd into any directory
  # holding one.
  - name: .envrc
